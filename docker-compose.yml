services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      CYBOG_RUNTIME: production
      CYBOG_CONFIG_PATH: /app/cybog/config.yaml
      CYBOG_OUTPUT_ROOT: /data/reports
      CORS_ORIGINS: "http://localhost:5173"
      API_RELOAD: "false"
    volumes:
      - cybog-data:/data
    restart: unless-stopped

volumes:
  cybog-data:
