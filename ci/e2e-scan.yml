# Artifacts
artifacts:
  - name: "E2E Scan Report"
    path: "ci/e2e-scan-reports/"
    type: "file"

# Environment variables
env:
  CYBOG_S3_BUCKET: "cybog-reports"
  CYBOG_S3_ENCRYPTION: "true"
  ALERT_CHANNELS:
    slack: "#cybog-alerts"
    pagerduty: "cybog-pagerduty"
    email: "security-team@cybog.example.com"
