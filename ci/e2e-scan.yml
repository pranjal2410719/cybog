  # Stage 2: E2E Scan Execution
  e2e_scan:
    name: "End-to-End Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Start JobScheduler"
        run: |
